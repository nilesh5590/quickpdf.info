<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split PDF - Extract Pages Online | QuickPDF</title>
    <meta name="description" content="Separate PDF pages or extract specific page ranges securely in your browser.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { ilp: { red: '#EB3D3F', darkred: '#D62E30', dark: '#3E4853', light: '#F8F9FA' } }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-ilp-light text-ilp-dark font-sans min-h-screen flex flex-col antialiased">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
            <div class="flex items-center space-x-8">
                <a href="index.html" class="flex items-center space-x-2">
                    <div class="w-9 h-9 bg-ilp-red rounded-lg flex items-center justify-center text-white font-black text-xl shadow-md">Q</div>
                    <span class="text-xl font-bold tracking-tight text-ilp-dark">Quick<span class="text-ilp-red">PDF</span></span>
                </a>
                <nav class="hidden md:flex space-x-6 text-sm font-semibold text-gray-600">
                    <a href="merge.html" class="hover:text-ilp-red transition">Merge PDF</a>
                    <a href="split.html" class="text-ilp-red font-semibold">Split PDF</a>
                    <a href="compress.html" class="hover:text-ilp-red transition">Compress PDF</a>
                    <a href="sign.html" class="hover:text-ilp-red transition">Sign PDF</a>
                    <a href="ocr.html" class="hover:text-ilp-red transition">OCR Text</a>
                </nav>
            </div>
            <div><a href="index.html" class="text-sm font-semibold text-gray-500 hover:text-ilp-red transition">&larr; All Tools</a></div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-4 py-12 w-full flex flex-col items-center">
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-black text-ilp-dark tracking-tight mb-2">SPLIT PDF DOCUMENT</h1>
            <p class="text-gray-500 text-base">Extract specific pages or split your PDF into independent files.</p>
        </div>

        <div id="upload-box" class="w-full max-w-xl bg-white border-2 border-dashed border-gray-300 rounded-3xl p-10 shadow-sm hover:border-ilp-red transition cursor-pointer text-center group" onclick="document.getElementById('file-input').click()">
            <input type="file" id="file-input" accept=".pdf" class="hidden">
            <div class="w-20 h-20 bg-red-50 text-ilp-red rounded-full flex items-center justify-center mx-auto mb-5 group-hover:scale-105 transition shadow-inner">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </div>
            <h3 class="text-xl font-bold text-ilp-dark mb-1">Select PDF file</h3>
            <p class="text-sm text-gray-400">or drop PDF here</p>
            <div class="mt-6 inline-block bg-ilp-red hover:bg-ilp-darkred text-white font-bold px-8 py-3.5 rounded-xl shadow-lg transition">Select PDF File</div>
        </div>

        <div id="workspace" class="hidden w-full max-w-2xl bg-white border border-gray-200 p-6 sm:p-8 rounded-3xl shadow-sm space-y-6">
            <h3 id="file-info" class="font-bold text-ilp-dark text-lg border-b pb-3"></h3>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Page Range to Extract (e.g., 1-3 or 2)</label>
                <input type="text" id="page-range" placeholder="e.g. 1-3" class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-ilp-red outline-none">
            </div>
            <button id="split-btn" class="w-full bg-ilp-red hover:bg-ilp-darkred text-white font-extrabold py-4 rounded-2xl shadow-lg transition tracking-wide text-lg">
                Split PDF & Download &rarr;
            </button>
        </div>

        <p id="status-message" class="mt-6 text-sm font-semibold text-ilp-red text-center hidden bg-red-50 px-4 py-2.5 rounded-xl border border-red-100"></p>
    </main>

    <footer class="bg-ilp-dark text-gray-400 text-xs py-8 mt-auto border-t border-gray-800">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center space-x-2 text-white font-bold text-sm"><div class="w-6 h-6 bg-ilp-red rounded flex items-center justify-center text-xs">Q</div><span>QuickPDF.info</span></div>
            <div>&copy; 2026 QuickPDF &bull; 100% Secure Client-Side Processing</div>
        </div>
    </footer>

    <script>
        let loadedPdfBytes = null;
        let originalFileName = '';
        const fileInput = document.getElementById('file-input');
        const uploadBox = document.getElementById('upload-box');
        const workspace = document.getElementById('workspace');
        const fileInfo = document.getElementById('file-info');
        const pageRangeInput = document.getElementById('page-range');
        const splitBtn = document.getElementById('split-btn');
        const statusMessage = document.getElementById('status-message');

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            originalFileName = file.name;
            loadedPdfBytes = await file.arrayBuffer();

            uploadBox.classList.add('hidden');
            workspace.classList.remove('hidden');
            fileInfo.textContent = `Loaded: ${file.name}`;
        });

        splitBtn.addEventListener('click', async () => {
            const rangeStr = pageRangeInput.value.trim();
            if (!rangeStr) {
                alert('Please enter a page range.');
                return;
            }

            statusMessage.textContent = 'Extracting pages...';
            statusMessage.classList.remove('hidden');
            splitBtn.disabled = true;

            try {
                const { PDFDocument } = PDFLib;
                const srcPdf = await PDFDocument.load(loadedPdfBytes, { ignoreEncryption: true });
                const newPdf = await PDFDocument.create();
                
                const totalPages = srcPdf.getPageCount();
                let indices = [];

                if (rangeStr.includes('-')) {
                    const parts = rangeStr.split('-');
                    let start = parseInt(parts[0]) - 1;
                    let end = parseInt(parts[1]) - 1;
                    for (let i = start; i <= end; i++) {
                        if (i >= 0 && i < totalPages) indices.push(i);
                    }
                } else {
                    let pageNum = parseInt(rangeStr) - 1;
                    if (pageNum >= 0 && pageNum < totalPages) indices.push(pageNum);
                }

                if (indices.length === 0) {
                    throw new Error("Invalid page range specified.");
                }

                const copiedPages = await newPdf.copyPages(srcPdf, indices);
                copiedPages.forEach(p => newPdf.addPage(p));

                const pdfBytes = await newPdf.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `split-${originalFileName}`;
                link.click();

                statusMessage.textContent = 'Success! Split PDF downloaded.';
            } catch (err) {
                console.error(err);
                statusMessage.textContent = `Error: ${err.message}`;
            } finally {
                splitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
